baseURL = 'https://herningfk.dk/'
locale = 'da-DK'
title = 'Herning Faldskærmsklub'

theme = ["github.com/gohugo-ananke/ananke/v2"]

DefaultContentLanguage = "da"
SectionPagesMenu = "main"
googleAnalytics = ""
enableRobotsTXT = true

publishDir = "./docs"

[languages]
  [languages.da]
    title = "HFK"
    weight = 1
    contentDir = "content/da"
    # languageDirection = 'rtl' for Right-To-Left languages

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  date_format = "2. January 2006"
  author = "Thomas Gilbert"
  # site_logo = "/images/logo.png"
  description = "Hjemmesiden for Herning Faldskærmsklub"
  # choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-green"
  recent_posts_number = 10

[params.ananke]
  # Extra stylesheets from assets/ananke/css/, bundled into the theme CSS
  custom_css = ["hfk.css"]

[params.leaderboard]
  # Leaderboard service behind the "Årets springere" card on the home page and
  # the /rangliste/ page (layouts/shortcodes/leaderboard.html). The service must
  # allow the site's origin in its CORS config.
  api = "https://leaderboard.itadvice.dk"
  # Used instead of `api` when running `hugo server`
  api_dev = "http://localhost:9080"
  dropzone_id = 178
